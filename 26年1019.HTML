<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>你好</title>

    <!-- 國際電話號碼驗證套件 -->
    <script src="https://jsdelivr.net"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f2f6fc;
            color: #333;
        }

        /* =========================
           Header
        ========================= */
        header {
            background: linear-gradient(135deg, #4a90e2, #6a5acd);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 42px;
        }

        header p {
            margin: 0;
            font-size: 18px;
        }

        /* =========================
           Nav
        ========================= */
        nav {
            background-color: #ffffff;
            text-align: center;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        nav a {
            color: #444;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: #4a90e2;
        }

        /* =========================
           Main
        ========================= */
        main {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            justify-content: center;
            align-items: start;
        }

        /* =========================
           Section
        ========================= */
        section {
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        section h2 {
            color: #4a90e2;
            border-left: 5px solid #4a90e2;
            padding-left: 12px;
            margin-top: 0;
        }

        /* =========================
           個人資料
        ========================= */
        .info p {
            font-size: 18px;
            line-height: 1.8;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        /* =========================
           自我介紹
        ========================= */
        .introduction {
            min-height: 150px;
            line-height: 2;
        }

        /* =========================
           Form
        ========================= */
        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.3);
        }

        /* =========================
           AI Chat Box 樣式
        ========================= */
        .chat-box {
            border: 1px solid #ddd;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
        }

        .chat-message {
            margin: 5px 0;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.4;
        }

        .user-msg {
            background-color: #e1f5fe;
            margin-left: auto;
            color: #0277bd;
            text-align: right;
        }

        .ai-msg {
            background-color: #eaeaea;
            margin-right: auto;
            color: #333;
        }

        .chat-input-group {
            display: flex;
            gap: 8px;
        }

        .chat-input-group input {
            flex: 1;
        }

        .chat-input-group button {
            margin-top: 0;
            padding: 10px 20px;
        }

        /* =========================
           Button
        ========================= */
        button {
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #4a90e2;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #357abd;
        }

        button:disabled {
            background-color: #b9dcff;
            color: white;
            cursor: not-allowed;
        }

        /* =========================
           Footer
        ========================= */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }

        footer p {
            margin: 5px;
        }

        /* =========================
           Mobile
        ========================= */
        @media (max-width: 767px) {
            header h1 {
                font-size: 32px;
            }

            nav a {
                margin: 0 8px;
                font-size: 14px;
            }

            main {
                width: 90%;
                grid-template-columns: 1fr;
                gap: 16px;
            }

            section {
                padding: 25px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         Header
    ========================= -->
    <header>
        <h1>你好</h1>
        <p>Welcome to my personal website</p>
    </header>


    <!-- =========================
         Navigation
    ========================= -->
    <nav>
        <a href="#about">個人資料</a>
        <a href="#introduction">自我介紹</a>
        <a href="#signup">報名表單</a>
        <a href="#ai-assistant">AI 助手</a>
    </nav>


    <!-- =========================
         Main
    ========================= -->
    <main>

        <!-- 個人資料 -->
        <section id="about">
            <h2>個人資料</h2>
            <div class="info">
                <p><strong>姓名：</strong>你好</p>
                <p><strong>學號：</strong>早安</p>
                <p><strong>學校：</strong>我很好</p>
            </div>
        </section>

        <!-- 自我介紹 -->
        <section id="introduction">
            <h2>自我介紹</h2>
            <div class="introduction">
                <p>大家好，我是你好。</p>
                <p>歡迎來到我的個人網站，很高興可以在這裡介紹自己。</p>
            </div>
        </section>

        <!-- 報名表單 -->
        <section id="signup">
            <h2>報名表單</h2>
            <form id="signupForm" onsubmit="event.preventDefault(); alert('報名成功！');">
                <label for="name">姓名：</label>
                <input id="name" type="text" placeholder="請輸入姓名" value="我的城市">
                <button type="submit">送出報名</button>
            </form>
        </section>

        <!-- =========================
             AI 本地助手區塊
        ========================= -->
        <section id="ai-assistant">
            <h2>AI 本地助手</h2>
            <div class="chat-box" id="chatBox">
                <div class="chat-message ai-msg">你好！我是本機 AI 助手，請問有什麼我可以幫忙的嗎？</div>
            </div>
            <div class="chat-input-group">
                <input type="text" id="chatInput" placeholder="輸入訊息...">
                <button id="sendBtn" onclick="sendMessage()">發送</button>
            </div>
        </section>

    </main>

    <!-- =========================
         Footer
    ========================= -->
    <footer>
        <p>© 2026 你好. All rights reserved.</p>
    </footer>


    <!-- =========================
         JavaScript API 串接邏輯
    ========================= -->
   
<script>
    async function sendMessage() {
        const inputField = document.getElementById('chatInput');
        const chatBox = document.getElementById('chatBox');
        const sendBtn = document.getElementById('sendBtn');
        const messageText = inputField.value.trim();

        if (!messageText) return;

        // 1. 將使用者輸入的訊息加到對話框
        appendMessage(messageText, 'user-msg');
        inputField.value = '';

        // 2. 顯示 AI 正在思考的狀態並停用發送鈕
        sendBtn.disabled = true;
        const loadingId = appendMessage('AI 正在思考中...', 'ai-msg');

        try {
            // 3. 呼叫 LM Studio 本地伺服器的正確 API 完整網址
            const response = await fetch('http://localhost:1234/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    messages: [
                        { role: "system", content: "你是一個親切的繁體中文網頁助理。" },
                        { role: "user", content: messageText }
                    ],
                    temperature: 0.7,
                    max_tokens: 512
                })
            });


            if (!response.ok) {
                throw new Error('本地 API 連線失敗，請確認 LM Studio 伺服器已啟動。');
            }

            const data = await response.json();
            const aiReply = data.choices[0].message.content;

            // 4. 移除思考提示，替換為 AI 真正的回答
            document.getElementById(loadingId).remove();
            appendMessage(aiReply, 'ai-msg');

        } catch (error) {
            console.error(error);
            if (document.getElementById(loadingId)) {
                document.getElementById(loadingId).remove();
            }
            // 已修正：補上正確的反單引號
            appendMessage(`錯誤: ${error.message}`, 'ai-msg');
        } finally {
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight; // 自動捲動到底部
        }
    }

    // 輔助函式：動態新增對話泡泡
    function appendMessage(text, className) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        const id = 'msg-' + Date.now();
        msgDiv.id = id;
        // 已修正：補上正確的反單引號
        msgDiv.className = `chat-message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }

    // 支援按下 Enter 鍵直接發送
    document.getElementById('chatInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }); 
</script>
